exchange:
  base_url: "https://api-demo.bybit.com"
  # Public WS: use mainnet stream (stream-demo does not support public; 404)
  public_ws_url: "wss://stream.bybit.com/v5/public/linear"
  private_ws_url: "wss://stream-demo.bybit.com/v5/private"
  testnet: true

# DEMO-only: multi-symbol basket for candidate observation.
# Expands opportunity set beyond single symbol when env=bybit_demo.
trading:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - LINKUSDT

# DEMO-only: relaxed breakout thresholds to increase candidate frequency.
# Applied only when runtime.mode is DEMO. PAPER/LIVE/BACKTEST use defaults.
runtime:
  # DEMO-only: even more relaxed profile (bps=1/2, vol=1.0, lookback=15). Overrides demo_candidate_overrides when enabled.
  # demo_more_opportunities_enabled: true
  demo_candidate_overrides:
    min_breakout_bps: 3
    min_trend_bps: 5
    min_volume_multiplier: 1.05
  # DEMO-only: minimum notional floor so valid candidates meet exchange min_qty.
  # When computed qty < min_qty, use this floor (capped at 10% equity). ~75 USDT covers 0.001 BTC.
  demo_sizing_min_notional_usdt: 75
  # DEMO-only: model filter mode. hard_block (default, active gating), active (alias for hard_block), shadow (score but never block), threshold_override (use threshold below).
  # model_filter_mode: hard_block
  # model_filter_mode: active   # alias for hard_block
  # model_filter_mode: shadow
  # DEMO-only: threshold for model gating. 0-1. Used by hard_block/active; shadow uses 0.5 for logging. Provisional validation threshold: 0.45.
  # model_filter_threshold: 0.45
