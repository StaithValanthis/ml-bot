[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ml-bot"
version = "0.1.0"
description = "Production-grade Bybit USDT perpetual futures trading system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ML Bot Team" }]
dependencies = [
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "websockets>=12.0",
  "aiohttp>=3.10.5",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "redis>=5.0.8",
  "pandas>=2.2.2",
  "polars>=1.5.0",
  "pyarrow>=17.0.0",
  "mlflow>=2.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.5",
  "mypy>=1.11.2",
  "types-PyYAML>=6.0.12.20240808",
]

[project.scripts]
trading-bot = "trading.main:main"
trading-backtest = "trading.backtest.run:main"
trading-offline-train = "trading.research.training.run_offline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^tests/"]
